<title>Панель консалтинга</title>

<style>
@font-face{font-family:'Golos Text';font-weight:400;font-display:swap;src:url(../assets/fonts/GolosText-400-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Golos Text';font-weight:400;font-display:swap;src:url(../assets/fonts/GolosText-400-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:'Manrope';font-weight:800;font-display:swap;src:url(../assets/fonts/Manrope-700-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';font-weight:800;font-display:swap;src:url(../assets/fonts/Manrope-700-lat.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:40px 24px;
 margin:0;background:#faf9f5;color:#1a1a19;font:400 17px/1.5 'Golos Text',system-ui,sans-serif}
.gate.ready{display:flex}
.gatebox{max-width:440px;width:100%;text-align:center}
.gatebox b{font-family:Manrope,sans-serif;font-weight:800;font-size:27px;line-height:1.2;letter-spacing:-.02em;display:block;margin-bottom:10px}
.gatebox p{font-size:16px;line-height:1.6;color:#6f6c64;margin:0 0 24px}
.gatebox form{display:flex;gap:10px}
.gatebox input{flex:1;min-width:0;background:#fff;border:1px solid #e4e0d6;border-radius:10px;padding:12px 14px;
 font:400 17px/1.3 'Golos Text',system-ui,sans-serif;color:#1a1a19}
.gatebox input:focus{outline:0;border-color:#b0382c}
.gatebox button{background:#b0382c;color:#fff;border:0;border-radius:10px;padding:12px 20px;
 font:600 15px/1.2 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.gatebox form.busy button{opacity:.6;pointer-events:none}
.gatebox form.busy button::after{content:'…'}
.gate-err{display:block;margin-top:14px;font-size:15px;line-height:1.5;color:#b0382c;min-height:22px}
@media(max-width:520px){.gatebox form{flex-direction:column}}
</style>

<div class="gate">
 <div class="gatebox">
  <b>Панель консалтинга</b>
  <p>Прототип панели. Введите пароль.</p>
  <form data-gate autocomplete="off">
   <input type="password" data-gate-pass placeholder="Пароль" autocomplete="current-password" autofocus>
   <button type="submit">Открыть панель</button>
  </form>
  <span class="gate-err" data-gate-err></span>
 </div>
</div>
