html,body{margin:0;background:#0e0f11}
.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:40px 24px;margin:0;background:#0e0f11;color:#ecebe6;font:400 17px/1.5 'Golos Text',system-ui,sans-serif}
.gate.ready{display:flex}
.gatebox{max-width:440px;width:100%;text-align:center}
.gatebox b{font-family:Manrope,sans-serif;font-weight:800;font-size:30px;line-height:1.2;letter-spacing:-.02em;display:block;margin-bottom:10px}
.gatebox b i{font-style:normal;color:#e8b84a}
.gatebox p{font-size:16px;line-height:1.6;color:#9a9890;margin:0 0 24px}
.gatebox form{display:flex;gap:10px}
.gatebox input{flex:1;min-width:0;background:#16181b;border:1px solid #2a2e33;border-radius:10px;padding:12px 14px;font:400 17px/1.3 'Golos Text',system-ui,sans-serif;color:#ecebe6}
.gatebox input:focus{outline:0;border-color:#e8b84a}
.gatebox button{background:#e8b84a;color:#141414;border:0;border-radius:10px;padding:12px 20px;font:600 15px/1.2 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.gatebox form.busy button{opacity:.6;pointer-events:none}
.gate-err{display:block;margin-top:14px;font-size:15px;line-height:1.5;color:#ff7a6a;min-height:22px}
@media(max-width:520px){.gatebox form{flex-direction:column}}
</style>

   <button type="submit">Открыть</button>
  </form>
  <span class="gate-err" data-gate-err></span>
 </div>
