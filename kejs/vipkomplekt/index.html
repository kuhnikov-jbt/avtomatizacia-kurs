.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:40px 24px;
 margin:0;background:#faf9f5;color:#1a1a19;font:400 17px/1.5 'Golos Text',system-ui,sans-serif}
.gate.ready{display:flex}
.gatebox{max-width:440px;width:100%;text-align:center}
.gatebox b{font-family:Manrope,sans-serif;font-weight:800;font-size:27px;line-height:1.2;letter-spacing:-.02em;display:block;margin-bottom:10px}
.gatebox p{font-size:16px;line-height:1.6;color:#6f6c64;margin:0 0 24px}
.gatebox form{display:flex;gap:10px}
.gatebox input{flex:1;min-width:0;background:#fff;border:1px solid #e4e0d6;border-radius:10px;padding:12px 14px;
 font:400 17px/1.3 'Golos Text',system-ui,sans-serif;color:#1a1a19}
.gatebox input:focus{outline:0;border-color:#b0382c}
.gatebox button{background:#b0382c;color:#fff;border:0;border-radius:10px;padding:12px 20px;
 font:600 15px/1.2 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.gatebox form.busy button{opacity:.6;pointer-events:none}
.gatebox form.busy button::after{content:'…'}
.gate-err{display:block;margin-top:14px;font-size:15px;line-height:1.5;color:#b0382c;min-height:22px}
@media(max-width:520px){.gatebox form{flex-direction:column}}

<script>
/* Замок кейса: страница приезжает зашифрованной, пароль превращается в ключ и открывает её.
   Ключ свой на каждый кейс, поэтому курс и другие кейсы он не трогает. */
(function () {
  var STORE = 'kejs-vipkomplekt-key';
  var box = document.querySelector('script[data-lock]');
  if (!box) return;
  var L = JSON.parse(box.textContent);
  var gate = document.querySelector('.gate');
  var form = document.querySelector('[data-gate]');
  var field = document.querySelector('[data-gate-pass]');
  var err = document.querySelector('[data-gate-err]');
  var slot = document.querySelector('[data-app]');

  function bytes(b64) {
    var raw = atob(b64), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function b64(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: bytes(L.s), iterations: L.n, hash: 'SHA-256' }, base, 256);
      });
  }
  function unlock(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(L.i) }, key, bytes(L.d));
      })
      .then(function (plain) {
        var page = JSON.parse(new TextDecoder().decode(plain));
        document.title = page.t;
        slot.innerHTML = page.h;
        if (gate) gate.parentNode.removeChild(gate);
      });
  }

  function ask() {
    if (gate) gate.classList.add('ready');
    if (field) field.focus();
  }

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    unlock(bytes(saved)).catch(function () {
      try { localStorage.removeItem(STORE); } catch (e) {}   // пароль сменили — спросим заново
      ask();
    });
  } else {
    ask();
  }

  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = (field.value || '').trim();
      if (!pass) return;
      err.textContent = '';
      form.classList.add('busy');
      derive(pass).then(function (rawKey) {
        return unlock(rawKey).then(function () {
          try { localStorage.setItem(STORE, b64(rawKey)); } catch (e) {}
        });
      }).catch(function () {
        form.classList.remove('busy');
        err.textContent = 'Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.';
        field.select();
      });
    });
  }
})();
</script>
