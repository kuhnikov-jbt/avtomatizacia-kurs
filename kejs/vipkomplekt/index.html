.gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:40px 24px;

.gate.ready{display:flex}
.gatebox{max-width:440px;width:100%;text-align:center}
.gatebox b{font-family:Manrope,sans-serif;font-weight:800;font-size:27px;line-height:1.2;letter-spacing:-.02em;display:block;margin-bottom:10px}

.gatebox form{display:flex;gap:10px}
.gatebox input{flex:1;min-width:0;background:#fff;border:1px solid #e4e0d6;border-radius:10px;padding:12px 14px;
 font:400 17px/1.3 'Golos Text',system-ui,sans-serif;color:#1a1a19}
.gatebox input:focus{outline:0;border-color:#b0382c}
.gatebox button{background:#b0382c;color:#fff;border:0;border-radius:10px;padding:12px 20px;
 font:600 15px/1.2 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.gatebox form.busy button{opacity:.6;pointer-events:none}
.gatebox form.busy button::after{content:'…'}
.gate-err{display:block;margin-top:14px;font-size:15px;line-height:1.5;color:#b0382c;min-height:22px}
@media(max-width:520px){.gatebox form{flex-direction:column}}
